# Direct Social, everything on localhost:
#   docker compose up --build
#   web http://localhost:3002, emails http://localhost:8025, storage http://localhost:9001
name: direct-social

x-social: &social
  build: services/social
  image: direct-social-api:dev
  environment: &social-env
    DATABASE_URL: postgres://social:social@postgres:5432/social?sslmode=disable
    WEB_URL: http://localhost:3002
    S3_ENDPOINT: minio:9000
    # Browsers download and upload directly, so URLs are signed for localhost.
    S3_PUBLIC_ENDPOINT: localhost:9000
    S3_ACCESS_KEY: social
    S3_SECRET_KEY: social-secret
    S3_BUCKET: social
    SMTP_ADDR: mailpit:1025
    MAIL_FROM: Direct Social <bonjour@directsocial.local>
  restart: unless-stopped

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: social
      POSTGRES_PASSWORD: social
      POSTGRES_DB: social
    ports: ["5434:5432"]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: social
      MINIO_ROOT_PASSWORD: social-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
    restart: unless-stopped

  migrate:
    <<: *social
    command: migrate
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *social
    command: api
    ports: ["8080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio: { condition: service_started }
      mailpit: { condition: service_started }

  worker:
    <<: *social
    command: worker
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio: { condition: service_started }

  web:
    build: apps/direct-social
    environment:
      API_URL: http://api:8080
    ports: ["3002:3000"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  postgres:
  minio:
